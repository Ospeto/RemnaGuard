services:
  remnaguard:
    build: .
    container_name: remnaguard
    restart: always
    env_file:
      - .env
    environment:
      - NODE_NAME=${NODE_NAME}
      - MONITOR_MODE=api-central
    volumes:
      - remnaguard_data:/app/data
      - ./config.yml:/app/config.yml:ro

volumes:
  remnaguard_data:


